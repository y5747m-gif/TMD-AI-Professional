<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <meta
    name="description"
    content="T.M.D AI - مساعدك الذكي للبرمجة والدراسة والكتابة والأسئلة الدينية"
  >

  <title>T.M.D AI — المساعد الذكي</title>

  <link rel="stylesheet" href="/style.css">
</head>


<body>

  <div class="app">


    <!-- ================================= -->
    <!-- القائمة الجانبية -->
    <!-- ================================= -->

    <aside class="sidebar" id="sidebar">

      <div class="brand">

        <div class="brand-icon">
          T
        </div>

        <div class="brand-text">

          <strong>
            T.M.D AI
          </strong>

          <span>
            المساعد الذكي
          </span>

        </div>

      </div>


      <button
        id="newChat"
        class="new-chat"
        type="button"
      >
        ＋ محادثة جديدة
      </button>


      <!-- ================================= -->
      <!-- الاقتراحات -->
      <!-- ================================= -->

      <div class="quick-title">
        اقتراحات سريعة
      </div>


      <button
        class="suggestion"
        data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة"
        type="button"
      >
        🤖 شرح الذكاء الاصطناعي
      </button>


      <button
        class="suggestion"
        data-prompt="اكتب لي كود HTML احترافي"
        type="button"
      >
        💻 اكتب كود احترافي
      </button>


      <button
        class="suggestion"
        data-prompt="حل لي هذه المسألة خطوة بخطوة"
        type="button"
      >
        🧮 حل مسألة
      </button>


      <button
        class="suggestion"
        data-prompt="ساعدني في الدراسة"
        type="button"
      >
        📚 ساعدني في الدراسة
      </button>


      <button
        class="suggestion"
        data-prompt="اشرح لي هذه الفتوى أو المسألة الدينية مع ذكر المصدر إن كان مؤكدًا"
        type="button"
      >
        📖 سؤال ديني
      </button>


      <button
        class="suggestion"
        data-prompt="قارن بين موقف الإسلام والمسيحية واليهودية من هذا الموضوع"
        type="button"
      >
        ⚖️ مقارنة الأديان
      </button>


      <!-- ================================= -->
      <!-- أسفل القائمة -->
      <!-- ================================= -->

      <div class="sidebar-bottom">

        <div class="status">

          <i></i>

          النظام جاهز

        </div>


        <div class="developer">
          المطور: ياسين عمرو عبد الرحيم
        </div>


        <button
          id="clearChat"
          class="clear"
          type="button"
        >
          مسح المحادثة
        </button>

      </div>

    </aside>


    <!-- ================================= -->
    <!-- المحتوى الرئيسي -->
    <!-- ================================= -->

    <main class="main">


      <!-- ================================= -->
      <!-- الشريط العلوي -->
      <!-- ================================= -->

      <header class="topbar">

        <button
          id="menuBtn"
          class="icon-btn menu-btn"
          type="button"
          aria-label="فتح القائمة"
        >
          ☰
        </button>


        <span class="top-title">

          T.M.D AI

          <i></i>

        </span>


        <button
          id="theme"
          class="icon-btn"
          type="button"
          aria-label="تغيير المظهر"
        >
          ☼
        </button>

      </header>


      <!-- ================================= -->
      <!-- منطقة المحادثة -->
      <!-- ================================= -->

      <section
        id="chat"
        class="chat"
        aria-live="polite"
      >


        <!-- ================================= -->
        <!-- شاشة الترحيب -->
        <!-- ================================= -->

        <div
          id="welcome"
          class="welcome"
        >

          <div class="welcome-logo">
            T
          </div>


          <h1>

            مرحبًا بك في

            <span>
              T.M.D AI
            </span>

          </h1>


          <p>
            مساعدك الذكي للبرمجة، الدراسة،
            الكتابة والأسئلة العامة والدينية.
          </p>


          <div class="welcome-cards">

            <button
              data-prompt="اكتب لي خطة برمجة لموقع احترافي"
              type="button"
            >
              خطة برمجة
            </button>


            <button
              data-prompt="اشرح لي هذا المفهوم ببساطة"
              type="button"
            >
              شرح مفهوم
            </button>


            <button
              data-prompt="اكتب لي كود JavaScript"
              type="button"
            >
              JavaScript
            </button>


            <button
              data-prompt="اشرح لي هذه المسألة الدينية مع ذكر المصادر المؤكدة فقط"
              type="button"
            >
              سؤال ديني
            </button>

          </div>

        </div>

      </section>


      <!-- ================================= -->
      <!-- صندوق الكتابة -->
      <!-- ================================= -->

      <div class="composer-wrap">


        <form
          id="composer"
          class="composer"
        >

          <textarea
            id="input"
            rows="1"
            maxlength="12000"
            placeholder="اكتب رسالتك هنا..."
            autocomplete="off"
            aria-label="رسالتك"
          ></textarea>


          <button
            id="send"
            type="submit"
            aria-label="إرسال"
          >
            ➤
          </button>

        </form>


        <div class="hint">
          Enter للإرسال · Shift + Enter لسطر جديد
        </div>


      </div>

    </main>

  </div>


  <!-- ================================= -->
  <!-- طبقة الهاتف -->
  <!-- ================================= -->

  <div
    id="overlay"
    class="overlay"
  ></div>


  <!-- ================================= -->
  <!-- JavaScript -->
  <!-- ================================= -->

  <script src="/app.js"></script>

</body>

</html>
