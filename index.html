<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#c9a227"
  >

  <title>T.M.D AI</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div id="overlay" class="overlay"></div>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside id="sidebar" class="sidebar">

      <div class="brand">

        <div
          id="brandIcon"
          class="brand-icon"
        >
          T
        </div>

        <div class="brand-text">

          <strong id="siteName">
            T.M.D AI
          </strong>

          <span id="siteDescription">
            المساعد الذكي
          </span>

        </div>

      </div>


      <button
        id="newChat"
        class="new-chat"
        type="button"
      >
        ＋ محادثة جديدة
      </button>


      <div class="quick-title">
        أدوات سريعة
      </div>


      <button
        class="suggestion"
        data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة"
        type="button"
      >
        🤖 شرح الذكاء الاصطناعي
      </button>


      <button
        class="suggestion"
        data-prompt="اكتب لي كود HTML احترافي"
        type="button"
      >
        💻 كتابة كود
      </button>


      <button
        class="suggestion"
        data-prompt="حل لي هذه المسألة خطوة بخطوة"
        type="button"
      >
        🧮 حل مسألة
      </button>


      <button
        class="suggestion"
        data-prompt="اشرح لي هذه المسألة الدينية مع ذكر المصادر المؤكدة فقط"
        type="button"
      >
        📖 سؤال ديني
      </button>


      <div class="sidebar-bottom">

        <div class="status">
          <i></i>
          النظام يعمل
        </div>


        <div
          id="developer"
          class="developer"
        >
          المطور: ياسين عمرو عبد الرحيم
        </div>


        <button
          id="clearChat"
          class="clear"
          type="button"
        >
          🗑 مسح المحادثة
        </button>


        <button
          id="ownerButton"
          class="clear owner-button"
          type="button"
        >
          ⚙️ لوحة المالك
        </button>

      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

      <header class="topbar">

        <button
          id="menuBtn"
          class="icon-btn menu-btn"
          type="button"
          aria-label="القائمة"
        >
          ☰
        </button>


        <div class="top-title">

          <i></i>

          <span id="topSiteName">
            T.M.D AI
          </span>

        </div>


        <button
          id="theme"
          class="icon-btn"
          type="button"
          aria-label="تغيير المظهر"
        >
          ☀
        </button>

      </header>


      <!-- =========================
           CHAT
      ========================== -->

      <section
        id="chat"
        class="chat"
      >

        <div
          id="welcome"
          class="welcome"
        >

          <div
            id="welcomeLogo"
            class="welcome-logo"
          >
            T
          </div>


          <h1>
            مرحبًا بك في
            <span id="welcomeSiteName">
              T.M.D AI
            </span>
          </h1>


          <p id="welcomeDescription">
            مساعدك الذكي للبرمجة والدراسة والكتابة
            والأسئلة العامة وتحليل الصور.
          </p>


          <div class="welcome-cards">

            <button
              data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة"
              type="button"
            >
              🤖 الذكاء الاصطناعي
            </button>


            <button
              data-prompt="اكتب لي برنامجًا بسيطًا"
              type="button"
            >
              💻 البرمجة
            </button>


            <button
              data-prompt="ساعدني في حل هذه المسألة"
              type="button"
            >
              🧮 الدراسة
            </button>


            <button
              data-prompt="أريد معرفة معلومات دينية موثوقة مع ذكر المصادر"
              type="button"
            >
              📖 الأسئلة الدينية
            </button>

          </div>

        </div>

      </section>


      <!-- =========================
           COMPOSER
      ========================== -->

      <div class="composer-wrap">

        <form
          id="composer"
          class="composer"
        >

          <!-- زر الصور + -->

          <button
            id="plusButton"
            type="button"
            class="plus-button"
            aria-label="إضافة"
            title="إضافة صورة"
          >
            ＋
          </button>


          <textarea
            id="input"
            rows="1"
            maxlength="12000"
            placeholder="اكتب رسالتك هنا..."
            autocomplete="off"
          ></textarea>


          <button
            id="send"
            type="submit"
            aria-label="إرسال"
            title="إرسال"
          >
            ➤
          </button>

        </form>


        <!-- قائمة زر + -->

        <div
          id="plusMenu"
          class="plus-menu"
          aria-hidden="true"
        >

          <button
            id="imageUploadButton"
            type="button"
          >
            📷
            <span>
              رفع صورة وتحليلها
            </span>
          </button>


          <button
            id="imageEditButton"
            type="button"
          >
            ✨
            <span>
              تعديل صورة
            </span>
          </button>

        </div>


        <input
          id="imageInput"
          type="file"
          accept="image/png,image/jpeg,image/webp,image/gif"
          hidden
        />


        <div
          id="imagePreview"
          class="image-preview"
          hidden
        >

          <img
            id="previewImage"
            src=""
            alt="معاينة الصورة"
          >

          <button
            id="removeImage"
            type="button"
            aria-label="إزالة الصورة"
          >
            ×
          </button>

        </div>


        <div class="hint">
          اضغط Enter للإرسال — Shift + Enter لسطر جديد
        </div>

      </div>

    </main>

  </div>


  <!-- =========================
       OWNER MODAL
  ========================== -->

  <div
    id="ownerModal"
    class="modal"
    hidden
  >

    <div class="modal-box">

      <button
        id="closeOwnerModal"
        class="modal-close"
        type="button"
      >
        ×
      </button>


      <!-- تسجيل دخول المالك -->

      <section
        id="ownerLoginSection"
        class="owner-section"
      >

        <div class="modal-icon">
          🔐
        </div>

        <h2>
          لوحة المالك
        </h2>

        <p>
          هذه المنطقة مخصصة لمالك الموقع فقط.
        </p>


        <form id="ownerLoginForm">

          <input
            id="ownerPassword"
            type="password"
            placeholder="كلمة مرور المالك"
            autocomplete="current-password"
            required
          >


          <button
            type="submit"
            class="owner-primary"
          >
            دخول المالك
          </button>

        </form>


        <div
          id="ownerLoginError"
          class="owner-error"
        ></div>

      </section>


      <!-- لوحة التحكم -->

      <section
        id="ownerPanelSection"
        class="owner-section"
        hidden
      >

        <h2>
          ⚙️ إعدادات الموقع
        </h2>


        <label>
          اسم الموقع

          <input
            id="settingSiteName"
            type="text"
            placeholder="T.M.D AI"
          >

        </label>


        <label>
          وصف الموقع

          <input
            id="settingDescription"
            type="text"
            placeholder="المساعد الذكي"
          >

        </label>


        <label>
          اسم المطور

          <input
            id="settingDeveloper"
            type="text"
            placeholder="ياسين عمرو عبد الرحيم"
          >

        </label>


        <label>
          اللون الأساسي

          <input
            id="settingPrimaryColor"
            type="color"
            value="#c9a227"
          >

        </label>


        <label>
          لون الخلفية

          <input
            id="settingBackgroundColor"
            type="color"
            value="#faf8f1"
          >

        </label>


        <label>
          شعار الموقع

          <input
            id="settingLogoText"
            type="text"
            maxlength="3"
            placeholder="T"
          >

        </label>


        <label>
          رابط صورة الخلفية

          <input
            id="settingBackgroundImage"
            type="url"
            placeholder="https://..."
          >

        </label>


        <div class="owner-actions">

          <button
            id="saveSettings"
            type="button"
            class="owner-primary"
          >
            💾 حفظ الإعدادات
          </button>


          <button
            id="ownerLogout"
            type="button"
            class="owner-secondary"
          >
            تسجيل خروج
          </button>

        </div>


        <div
          id="settingsMessage"
          class="settings-message"
        ></div>

      </section>

    </div>

  </div>


  <script src="/app.js"></script>

</body>
</html>
