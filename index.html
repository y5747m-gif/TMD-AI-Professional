<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="T.M.D AI — مساعد ذكاء اصطناعي احترافي">
  <title>T.M.D AI — المساعد الذكي</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app-shell">

    <!-- القائمة الجانبية -->
    <aside class="sidebar" id="sidebar">

      <div class="brand">
        <div class="brand-mark">T</div>

        <div>
          <strong>T.M.D AI</strong>
          <span>المساعد الذكي</span>
        </div>
      </div>

      <button id="newChat" class="new-chat">
        <span>＋</span>
        <span>محادثة جديدة</span>
      </button>

      <div class="sidebar-label">
        ماذا تريد أن تفعل؟
      </div>

      <div class="quick-actions">

        <button class="quick-action"
          data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة ومفهومة">

          <span class="quick-icon">✦</span>

          <span>
            <b>شرح مفهوم</b>
            <small>تبسيط أي موضوع</small>
          </span>

        </button>


        <button class="quick-action"
          data-prompt="اكتب لي كود JavaScript احترافي واشرح طريقة استخدامه">

          <span class="quick-icon">⌘</span>

          <span>
            <b>برمجة</b>
            <small>اكتب وراجع الكود</small>
          </span>

        </button>


        <button class="quick-action"
          data-prompt="ساعدني في حل هذه المسألة خطوة بخطوة">

          <span class="quick-icon">∑</span>

          <span>
            <b>حل مسألة</b>
            <small>خطوات واضحة</small>
          </span>

        </button>


        <button class="quick-action"
          data-prompt="ساعدني في إعداد خطة مذاكرة منظمة">

          <span class="quick-icon">▤</span>

          <span>
            <b>الدراسة</b>
            <small>خطط ومراجعة</small>
          </span>

        </button>

      </div>


      <div class="sidebar-footer">

        <div class="status">
          <span class="status-dot"></span>
          <span>النظام متصل</span>
        </div>

        <button id="clearChat" class="clear-btn">
          مسح المحادثة
        </button>

      </div>

    </aside>


    <!-- المحتوى الرئيسي -->
    <main class="main">

      <header class="topbar">

        <div class="mobile-brand">

          <button
            id="menuBtn"
            class="icon-btn"
            aria-label="فتح القائمة">
            ☰
          </button>

          <div class="mini-mark">
            T
          </div>

          <strong>
            T.M.D AI
          </strong>

        </div>


        <div class="topbar-center">

          <span class="online-dot"></span>

          <span>
            مساعد T.M.D AI
          </span>

        </div>


        <button
          id="theme"
          class="icon-btn"
          aria-label="تغيير المظهر"
          title="تغيير المظهر">

          ☼

        </button>

      </header>


      <!-- المحادثة -->
      <section id="chat" class="chat">

        <div id="welcome" class="welcome">

          <div class="hero-glow"></div>

          <div class="welcome-logo">
            T
          </div>

          <div class="eyebrow">

            <span>✦</span>

            جاهز لمساعدتك

          </div>


          <h1>

            مرحبًا بك في

            <span>
              T.M.D AI
            </span>

          </h1>


          <p>

            مساعد ذكي للبرمجة والدراسة والكتابة وحل المشكلات
            — بتجربة بسيطة وسريعة.

          </p>


          <div class="welcome-cards">


            <button
              data-prompt="اكتب لي خطة برمجة لموقع احترافي">

              <span>⌘</span>

              <b>
                خطة برمجة
              </b>

              <small>
                ابدأ مشروعك
              </small>

            </button>


            <button
              data-prompt="اشرح لي هذا المفهوم ببساطة مع مثال">

              <span>✦</span>

              <b>
                شرح مفهوم
              </b>

              <small>
                افهم أي موضوع
              </small>

            </button>


            <button
              data-prompt="اكتب لي كود JavaScript احترافي">

              <span>{ }</span>

              <b>
                كود JavaScript
              </b>

              <small>
                حلول برمجية
              </small>

            </button>


          </div>

        </div>

      </section>


      <!-- مربع الكتابة -->
      <div class="composer-area">

        <form id="composer" class="composer">

          <textarea
            id="input"
            rows="1"
            maxlength="12000"
            autocomplete="off"
            placeholder="اكتب رسالتك هنا...">
          </textarea>


          <button
            id="send"
            type="submit"
            aria-label="إرسال">

            ➤

          </button>

        </form>


        <div class="composer-bottom">

          <span>
            Enter للإرسال · Shift + Enter لسطر جديد
          </span>

          <span>
            T.M.D AI
          </span>

        </div>

      </div>

    </main>

  </div>


  <div id="overlay" class="overlay"></div>


  <script src="/app.js"></script>

</body>
</html>
